name: Skill and webpage contract
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check docs/app.js
      - run: node --check docs/analytics.js && node --check docs/citation-index.js
      - run: node tests/citation_index.cjs
      - run: node tests/analytics_ui.cjs
